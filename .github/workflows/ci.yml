name: CI

on:
  push:
  pull_request:

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Disabled on push/PR to save GitHub Actions minutes (macOS runners bill at
  # 10x). The same lint/test/build gate still runs on every tagged release as a
  # required job in release.yml, so nothing ships unlinted, untested, or broken.
  # Flip this `if:` to true to also run the full gate on every push.
  build-and-test:
    if: ${{ false }}
    name: Lint, test, build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install xcodegen and swift-format
        run: brew install xcodegen swift-format

      - name: Lint formatting
        run: make lint-format

      - name: Run package tests
        run: make test

      - name: Build the app (unsigned)
        run: make build XCODEBUILD_FLAGS="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO"

  # Cheap (ubuntu, ~seconds) security invariant that stays on even while the macOS
  # build-and-test job is paused: the crash-reporting SDK must stay confined to
  # one auditable file.
  telemetry-chokepoint:
    name: Telemetry chokepoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Only Telemetry.swift may import Sentry
        run: |
          offenders=$(grep -rl "import Sentry" App | grep -vx "App/Telemetry.swift" || true)
          if [ -n "$offenders" ]; then
            echo "::error::Sentry imported outside App/Telemetry.swift:"; echo "$offenders"; exit 1
          fi
          echo "OK: Sentry is confined to App/Telemetry.swift"
