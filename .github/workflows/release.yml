name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release + upload assets
  id-token: write # OIDC token for the SLSA provenance attestation signer
  attestations: write # store the attestation

jobs:
  release:
    runs-on: macos-26 # match CI's Tahoe SDK

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install xcodegen
        run: brew install xcodegen

      # Runs embed-build-info.sh (GITHUB_SHA is set, so it bakes the tagged
      # commit) and xcodegen. The .xcodeproj is not committed.
      - name: Generate project
        run: make generate

      - name: Build, sign, notarize, staple
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_API_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}
        run: scripts/build-amazon-order-export-dmg.sh

      - name: Locate DMG
        id: dmg
        shell: bash
        run: |
          dmg_path="$(find build/release -maxdepth 1 -name '*.dmg' -print | head -n 1)"
          if [[ -z "${dmg_path}" ]]; then
            echo "No DMG artifact found in build/release" >&2
            exit 1
          fi
          echo "path=${dmg_path}" >> "$GITHUB_OUTPUT"

      - name: Checksum
        id: checksum
        shell: bash
        run: |
          dmg_path="${{ steps.dmg.outputs.path }}"
          # Write the checksum with just the basename (not the build/release/…
          # path) so `shasum -a 256 -c AmazonOrderExport-*.dmg.sha256` verifies
          # the downloaded file directly.
          ( cd "$(dirname "${dmg_path}")" && shasum -a 256 "$(basename "${dmg_path}")" ) \
            | tee "${dmg_path}.sha256"
          echo "sha256=$(shasum -a 256 "${dmg_path}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ steps.dmg.outputs.path }}

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.dmg.outputs.path }}
            ${{ steps.dmg.outputs.path }}.sha256
          generate_release_notes: true
          body: |
            ### Verifying this build

            **SHA-256:** `${{ steps.checksum.outputs.sha256 }}`

            ```sh
            shasum -a 256 AmazonOrderExport*.dmg            # matches the hash above
            gh attestation verify AmazonOrderExport*.dmg --repo natikgadzhi/amazon-order-export
            ```

            The running app's About panel shows the commit it was built from. See
            [SECURITY.md](https://github.com/natikgadzhi/amazon-order-export/blob/main/SECURITY.md).

      - name: Check out the Homebrew tap
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v4
        with:
          repository: natikgadzhi/homebrew-taps
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: tap

      - name: Regenerate and push the cask
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cat > tap/Casks/amazon-order-export.rb <<EOF
          # This file is updated by the amazon-order-export release workflow. DO NOT EDIT.
          cask "amazon-order-export" do
            version "${version}"
            sha256 "${SHA256}"

            url "https://github.com/natikgadzhi/amazon-order-export/releases/download/v#{version}/AmazonOrderExport-#{version}.dmg",
                verified: "github.com/natikgadzhi/amazon-order-export/"
            name "Amazon Order Export"
            desc "Exports your own Amazon order and transaction history to CSV"
            homepage "https://github.com/natikgadzhi/amazon-order-export"

            depends_on macos: ">= :tahoe"

            app "Amazon Order Export.app"

            zap trash: [
              "~/Library/Caches/io.respawn.AmazonOrderExport",
              "~/Library/Preferences/io.respawn.AmazonOrderExport.plist",
              "~/Library/Saved Application State/io.respawn.AmazonOrderExport.savedState",
            ]
          end
          EOF
          cd tap
          if git diff --quiet -- Casks/amazon-order-export.rb; then
            echo "Cask already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/amazon-order-export.rb
          git commit -m "Brew cask update for amazon-order-export version v${version}"
          git push origin HEAD:main
