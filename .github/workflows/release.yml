name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release + upload assets
  id-token: write # OIDC token for the SLSA provenance attestation signer
  attestations: write # store the attestation

jobs:
  release:
    runs-on: macos-26 # match CI's Tahoe SDK

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install xcodegen
        run: brew install xcodegen

      # Runs embed-build-info.sh (GITHUB_SHA is set, so it bakes the tagged
      # commit) and xcodegen. The .xcodeproj is not committed.
      - name: Generate project
        run: make generate

      - name: Build, sign, notarize, staple
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_API_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}
        run: scripts/build-amazon-order-export-dmg.sh

      - name: Locate DMG
        id: dmg
        shell: bash
        run: |
          dmg_path="$(find build/release -maxdepth 1 -name '*.dmg' -print | head -n 1)"
          if [[ -z "${dmg_path}" ]]; then
            echo "No DMG artifact found in build/release" >&2
            exit 1
          fi
          echo "path=${dmg_path}" >> "$GITHUB_OUTPUT"

      - name: Checksum
        run: shasum -a 256 "${{ steps.dmg.outputs.path }}" | tee "${{ steps.dmg.outputs.path }}.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ steps.dmg.outputs.path }}

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.dmg.outputs.path }}
            ${{ steps.dmg.outputs.path }}.sha256
          generate_release_notes: true
