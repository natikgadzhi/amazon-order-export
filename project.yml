name: AmazonOrderExport
options:
  bundleIdPrefix: io.respawn
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  AmazonAuth:
    path: Packages/AmazonAuth
  AmazonOrders:
    path: Packages/AmazonOrders
  TelemetryScrub:
    path: Packages/TelemetryScrub
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    from: 8.57.3
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AmazonOrderExport:
    # An .app bundle (not a bare tool): WKWebView's WebContent helper process
    # only launches from inside a real, signed bundle. It's a normal windowed
    # SwiftUI app.
    type: application
    platform: macOS
    sources:
      - App
    preBuildScripts:
      - name: Embed build info
        script: scripts/embed-build-info.sh
        basedOnDependencyAnalysis: false
    dependencies:
      - package: AmazonAuth
      - package: AmazonOrders
      - package: TelemetryScrub
        product: TelemetryScrub
      - package: Sentry
        product: Sentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.respawn.AmazonOrderExport
        # App/Info.plist is a hand-written template with $(VAR) substitutions.
        # We use INFOPLIST_FILE instead of GENERATE_INFOPLIST_FILE because
        # GENERATE_INFOPLIST_FILE + INFOPLIST_KEY_* only supports Apple-registered
        # keys; custom keys like SENTRY_DSN need a real plist template.
        INFOPLIST_FILE: App/Info.plist
        # App icon from App/Assets.xcassets/AppIcon.appiconset (macOS sizes).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Spaced display name everywhere (menu bar, About panel, Finder).
        INFOPLIST_KEY_CFBundleDisplayName: Amazon Order Export
        # Stable code signature, on purpose. macOS keys a Keychain item's
        # no-prompt access on the app's *designated requirement* (team + bundle
        # id) for a real identity, but on the per-build cdhash for an ad-hoc
        # signature. Ad-hoc therefore re-prompts on every rebuild; a Developer ID
        # signature is stable across rebuilds — and matches the eventual notarized
        # release, so the stored session survives an app upgrade. The session item
        # stays app-private (default ACL); other tools must be granted access
        # explicitly. CI passes CODE_SIGNING_ALLOWED=NO (no certs on the runner).
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: "9YKSA5B4FP"
        # Sentry DSN is injected at build time only for official releases:
        # the release workflow passes SENTRY_DSN=<secret> to xcodebuild. Empty by
        # default, so local `make run` and open-source/CI builds have no DSN and
        # telemetry stays disabled (see App/Telemetry.swift's start() guard).
        SENTRY_DSN: ""
      configs:
        # Release-only hardened runtime, so an Xcode/CI Release build matches the
        # DMG script's `codesign --options runtime`. Debug stays unhardened and
        # keeps com.apple.security.get-task-allow for debugger attach. Base
        # signing (Manual / Developer ID / 9YKSA5B4FP) is unchanged.
        Release:
          ENABLE_HARDENED_RUNTIME: YES
