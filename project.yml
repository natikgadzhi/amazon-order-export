name: AmazonOrderExport
options:
  bundleIdPrefix: io.respawn
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  AmazonAuth:
    path: Packages/AmazonAuth
  AmazonOrders:
    path: Packages/AmazonOrders
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AmazonOrderExport:
    # An .app bundle (not a bare tool): WKWebView's WebContent helper process
    # only launches from inside a real, signed bundle. It's a normal windowed
    # SwiftUI app.
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: AmazonAuth
      - package: AmazonOrders
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.respawn.AmazonOrderExport
        GENERATE_INFOPLIST_FILE: YES
        # Stable code signature, on purpose. macOS keys a Keychain item's
        # no-prompt access on the app's *designated requirement* (team + bundle
        # id) for a real identity, but on the per-build cdhash for an ad-hoc
        # signature. Ad-hoc therefore re-prompts on every rebuild; a Developer ID
        # signature is stable across rebuilds — and matches the eventual notarized
        # release, so the stored session survives an app upgrade. The session item
        # stays app-private (default ACL); other tools must be granted access
        # explicitly. CI passes CODE_SIGNING_ALLOWED=NO (no certs on the runner).
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: "9YKSA5B4FP"
